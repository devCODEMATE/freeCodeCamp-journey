<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcard Quiz App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Flashcard Quiz</h1>

      <div id="flashcard" class="flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-front">
            <p id="question-text"></p>
          </div>
          <div class="flashcard-back">
            <p id="answer-text"></p>
          </div>
        </div>
      </div>

      <button id="delete-btn" type="button">Delete Card</button>

      <form id="entry-form">
        <label for="front-text">Question</label>
        <textarea id="front-text"></textarea>

        <label for="back-text">Answer</label>
        <textarea id="back-text"></textarea>

        <button type="submit">Add Card</button>
      </form>
    </main>

    <script src="index.ts"></script>
  </body>
</html>
